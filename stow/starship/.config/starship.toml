# Starship configuration (~/.config/starship.toml)
# Modern, fast prompt styling (Caelestia Material You M3 matching)

format = """
$directory\
$git_branch\
$git_status\
$nodejs\
$python\
$rust\
$golang\
$cmd_duration\
$line_break\
$character"""

# Timeout for prompt commands
command_timeout = 1000

[character]
success_symbol = "[❯](bold #d0bcff)"
error_symbol = "[❯](bold #f2b8b5)"

[directory]
truncation_length = 3
truncation_symbol = "…/"
style = "bold #a8c7fa"
read_only = " 󰌾"

[git_branch]
symbol = " "
style = "bold #efb8c8"

[git_status]
style = "bold #f2b8b5"
format = '([$all_status$ahead_behind]($style) )'

[cmd_duration]
min_time = 2000
format = "took [$duration](#fedba8) "

[nodejs]
symbol = "󰎙 "
style = "bold #c4eed0"

[python]
symbol = "󰌠 "
style = "bold #fedba8"

[rust]
symbol = "󱘗 "
style = "bold #f2b8b5"

[golang]
symbol = "󰟓 "
style = "bold #a8c7fa"
