# Kitty configuration
# Managed by dotfiles

font_family      JetBrainsMono Nerd Font
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size        12.0

# Window padding & opacity
window_padding_width 14
background_opacity 0.88
hide_window_decorations yes
confirm_os_window_close 0

# Scroll & Touchpad (Wayland smooth scrolling & inertia tuning)
# momentum_scroll: 0.92 滑順舒適慣性（0 為無慣性，預設 0.96）
momentum_scroll         0.92
touch_scroll_multiplier 2.0
wheel_scroll_multiplier 4.0
wheel_scroll_min_lines  1
scrollback_lines        10000

# Cursor
cursor            #d0bcff
cursor_text_color #141218
cursor_shape beam
cursor_blink_interval 0.5

# Caelestia Material You (M3) Morandi Color Scheme
foreground            #e6e1e5
background            #141218
selection_foreground  none
selection_background  #4a4458

# Color palette
color0  #141218
color8  #49454f
color1  #f2b8b5
color9  #f2b8b5
color2  #c4eed0
color10 #c4eed0
color3  #fedba8
color11 #fedba8
color4  #a8c7fa
color12 #a8c7fa
color5  #d0bcff
color13 #efb8c8
color6  #a0dcdb
color14 #a0dcdb
color7  #cac4d0
color15 #e6e1e5
