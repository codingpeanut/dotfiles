# =============================================================================
# Noctalia Shell Configuration (v5+)
# Niri + Wayland 現代微透桌面 (Debian / Fedora)
# 風格：Tokyo Night (東京之夜深色系) + 微透毛玻璃 (Glassmorphism)
# 架構：GNU Stow + Justfile
# =============================================================================

# ── 無障礙與縮放 ─────────────────────────────────────────────────────────────
[accessibility]
ui_scale              = 1.0
high_contrast         = false

# ── 外殼核心設定 (Shell Core) ────────────────────────────────────────────────
[shell]
corner_radius_scale   = 1.25         # 圓角半徑縮放 (12-16px 柔和圓角)
font_family           = "Rubik, Noto Sans CJK TC, JetBrainsMono Nerd Font, sans-serif"
time_format           = "{:%H:%M}"   # 狀態列時間格式
date_format           = "{:%a, %b %d}" # 狀態列日期格式 (例如: Fri, Oct 9)
offline_mode          = false
telemetry_enabled     = false        # 關閉任何遙測連線
niri_overview_type_to_launch_enabled = true # Niri 工作區鳥瞰時直接打字搜尋啟動

# 剪貼簿整合 (替代外部 cliphist，內建毛玻璃歷史選單)
clipboard_enabled     = true
clipboard_history_max_entries = 150
clipboard_keep_from_closed_apps = true
clipboard_auto_paste  = "auto"

shared_gl_context     = true

# 截圖工具 (Windows 剪取工具快捷鍵 Win+Shift+S 呼叫)
[shell.screenshot]
skip_annotate_on_copy_save = false
close_on_copy = true
close_on_save = true

# 動效與陰影 (物理彈簧柔和動效)
[shell.animation]
enabled = true
speed   = 1.0

[shell.shadow]
direction = "down"
alpha     = 0.55

# 懸浮島與面板排版
[shell.panel]
transparency_mode        = "glass"    # solid | soft | glass (微透毛玻璃)
borders                  = true
border_color             = "#d0bcff"  # Caelestia M3 柔和紫藍邊框微發光
border_width             = 1.0
shadow                   = true
launcher_placement       = "floating" # Spotlight 居中浮動啟動器
clipboard_placement      = "attached" # 剪貼簿附著於頂部狀態列下拉，不再於正中央懸浮大方塊
control_center_placement = "attached" # 頂部列吸附抽屜控制中心
wallpaper_placement      = "attached"
session_placement        = "attached"
launcher_position        = "center"
clipboard_position       = "auto"

# ── 控制中心與展開面板 (Caelestia Nexus 規格：多分頁導覽) ────────────────────
[control_center]
sidebar                  = "full"     # "full"：完整分類側邊欄導覽 (Dash, Media, Audio, System, Weather)
width                    = 880        # 控制中心面板展開寬度 (對齊 Caelestia Nexus minWidth 800 - 900)
show_shortcut_labels     = true       # 快捷捷徑圖示下方顯示標籤文字
show_session_button      = true       # 頂部顯示電源操作鈕

[[control_center.shortcuts]]
type = "wifi"

[[control_center.shortcuts]]
type = "bluetooth"

[[control_center.shortcuts]]
type = "nightlight"

[[control_center.shortcuts]]
type = "notification"

[[control_center.shortcuts]]
type = "caffeine"

[[control_center.shortcuts]]
type = "mic_mute"

[[control_center.shortcuts]]
type = "wallpaper"

[[control_center.shortcuts]]
type = "system"

# ── 通知系統 (Caelestia 右上角 430px 懸浮通知面板) ───────────────────────────
[notification]
enable_daemon            = true       # 接管通知守護進程
position                 = "top_right"# 移至右上角 (對齊 Caelestia NotifsTokens)
offset_x                 = 20         # 距離螢幕右側邊界 20px
offset_y                 = 52         # 避開頂部 38px 懸浮島與邊距
width                    = 430        # 橫向寬度 430px (精確複製 Caelestia NotifsTokens.width = 430)
max_visible              = 5          # 最多同時顯示 5 則通知
collapse_on_dismiss      = true       # 關閉單則通知時自動平滑折疊
keep_dismissed_in_history= true       # 關閉的通知仍保留在控制中心歷史紀錄

# ── 音量與亮度 OSD (Caelestia 右側居中/右下角滑桿) ───────────────────────────
[osd]
position                 = "bottom_right" # 靠右下角顯示 (對齊 Caelestia OSD Wrapper)
offset_x                 = 24
offset_y                 = 24

# ── 狀態列外觀 (Bar - Caelestia 頂部水平懸浮藥丸島與 Material M3 微透膠囊) ─────
[bar.default]
position               = "top"               # 依使用者需求：維持在頂部水平懸浮列
floating               = true                # 啟用 Caelestia 懸浮島模式
thickness              = 38                  # 高度 38px (開闊通透的膠囊高度)
margin_edge            = 8.0                 # 螢幕頂部邊距 8px (頂部微懸浮島嶼感)
margin_ends            = 12.0                # 螢幕左右邊距 12px (完全獨立懸浮島)
margin_opposite_edge   = 0.0
reserve_space          = true                # 保留專屬空間排擠視窗
radius                 = 16                  # 懸浮島四周 16px 柔和圓角 (對齊 Caelestia rounding.large)
concave_edge_corners   = false               # 停用內縮圓角
padding                = 10                  # 兩側內容內縮 10px
widget_spacing         = 8                   # 模組之間的間距 8px (對齊 Caelestia spacing.small)
border_width           = 1.0                 # 細緻高光邊框 1px
border_color           = "#d0bcff26"         # 15% 微透淡紫高光邊框
background             = "#141218d9"         # Caelestia M3 深色莫蘭迪底色 (85% 不透明度)

# 佈局分組 (時間至中，指示器至左，托盤收合)
# 1. 左側首端組：Logo/Launcher 啟動按鈕 + 工作區指示器 + 焦點視窗指示器
start                  = ["launcher", "workspaces", "active_window"]
# 2. 正中央獨立組：時鐘與日期置中 (Caelestia 招牌字體與點分隔排版)
center                 = ["clock"]
# 3. 右側末端組：多媒體黑膠 + 可收合托盤抽屜 + 狀態圖示組 (網路/藍牙/電量/音量) + 電源按鈕
end                    = ["media", "tray", "network", "bluetooth", "battery", "volume", "session"]

# 膠囊模組外觀 (Caelestia M3 獨立膠囊 pill 樣式)
capsule                = true
capsule_radius         = 8
capsule_padding        = 8
capsule_fill           = "#211f26e6"         # Caelestia M3 容器膠囊底色 (90% 不透明度)
capsule_border_width   = 0

[widget.launcher]
glyph                  = "apps"              # Caelestia 應用啟動膠囊圖示
color                  = "#d0bcff"           # Caelestia m3primary

[widget.media]
artist_first           = true
art_size               = 20
max_length             = 180
hide_when_no_media     = true
hide_when_idle         = false
rotate_album_art       = true
color                  = "#efb8c8"

[widget.workspaces]
style                  = "focus_hint"        # Caelestia 招牌指示器：閒置為精緻圓點，活躍為加長藥丸並帶焦點應用圖示
hide_empty             = false
show_labels            = true
show_icons             = true                # 活躍藥丸展示焦點視窗圖示
pill_scale             = 1.1                 # 藥丸飽滿厚度
active_pill_size       = 3.0                 # 當前頁面指示器橫向拉長 (Caelestia 流體動效)
inactive_pill_size     = 1.4                 # 閒置頁面精緻小圓點
capsule_padding        = 10
active_color           = "#d0bcff"           # Caelestia m3primary
inactive_color         = "#49454f"           # Caelestia m3outline

[widget.active_window]
max_length             = 40                  # 左側焦點視窗標題指示器
color                  = "#a8c7fa"           # Caelestia m3secondary 冰藍

[widget.clock]
format                 = "%H:%M  •  %a, %b %d" # Caelestia 招牌文字排版：點分隔時間與星期日期
color                  = "#efb8c8"           # Caelestia m3tertiary 柔粉色

[widget.volume]
color                  = "#a8c7fa"

[widget.brightness]
color                  = "#fedba8"

[widget.network]
color                  = "#a8c7fa"

[widget.bluetooth]
color                  = "#d0bcff"

[widget.battery]
color                  = "#c4eed0"

[widget.tray]
drawer                 = true                # 依要求：可收合系統托盤抽屜 (Collapsible Tray Drawer)
drawer_columns         = 3                   # 抽屜展開欄數
chevron_color          = "#d0bcff"           # 收合切換箭頭顏色
icon_size              = 16

[widget.clipboard]
color                  = "#d0bcff"

[widget.session]
color                  = "#f2b8b5"           # Caelestia m3error 珊瑚紅電源鈕

# Spotlight 居中搜尋啟動器 (Win 鍵喚出)
[shell.launcher]
categories                 = true
show_icons                 = true
show_app_origin_indicator  = true
compact                    = false
app_grid                   = false
sort_by_usage              = true
pinned                     = ["kitty", "org.gnome.Nautilus", "google-chrome", "firefox"]
fetch_exchange_rates       = false
provider_prefix            = "/"
auto_paste                 = "auto"

[shell.launcher.providers.calculator]
prefix = "calc"
global = true                         # 直接在搜尋列計算算式 (如 128*4)

[shell.launcher.providers.emoji]
prefix = "emo"

[shell.launcher.providers.session]
prefix = "session"
global = true                         # 支援直接搜尋 lock / reboot / poweroff

[shell.launcher.providers.windows]
prefix = "win"

[shell.launcher.providers.wallpaper]
prefix = "wall"

# 視窗預覽與循環切換 (Alt+Tab)
[shell.window_switcher]
style        = "carousel"             # 3D 景深輪播切換視窗
mru          = true                   # 最近使用順序
show_caption = true
show_count   = true
show_app_icon = true

# ── 動態桌布守護 (Wallpaper Daemon) ──────────────────────────────────────────
[wallpaper]
enabled             = true
fill_mode           = "crop"
transition          = ["fade", "zoom", "honeycomb"]
transition_duration = 1200
edge_smoothness     = 0.3
directory           = "~/Pictures/Wallpapers"

[wallpaper.automation]
enabled                    = false
interval_seconds           = 1800
order                      = "random"
recursive                  = true

# ── 即時天氣服務 (Caelestia Weather Tab) ──────────────────────────────────────
[weather]
enabled             = true

# ── 系統效能監控 (Caelestia Performance Tab) ──────────────────────────────────
[system.monitor]
cpu_poll_seconds    = 2.0
memory_poll_seconds = 2.0
network_poll_seconds= 3.0
disk_poll_seconds   = 10.0

# ── 主題配色 (Caelestia Material You M3 莫蘭迪深色底襯與暗色系面板) ─────────
[theme]
mode       = "dark"                       # 深色模式：應用程式、Launcher 與彈出視窗呈現深邃莫蘭迪風格
shell_mode = "dark"                       # 控制中心、剪貼簿選單等外殼浮動面板使用深色莫蘭迪模式
source     = "builtin"
