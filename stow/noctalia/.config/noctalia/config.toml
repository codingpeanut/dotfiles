# =============================================================================
# Noctalia Shell Configuration (v5+)
# Niri + Wayland 現代微透桌面 (Debian / Fedora)
# 風格：Tokyo Night (東京之夜深色系) + 微透毛玻璃 (Glassmorphism)
# 架構：GNU Stow + Justfile
# =============================================================================

# ── 無障礙與縮放 ─────────────────────────────────────────────────────────────
[accessibility]
ui_scale              = 1.0
high_contrast         = false

# ── 外殼核心設定 (Shell Core) ────────────────────────────────────────────────
[shell]
corner_radius_scale   = 1.25         # 圓角半徑縮放 (12-16px 柔和圓角)
font_family           = "JetBrainsMono Nerd Font, Noto Sans CJK TC, sans-serif"
time_format           = "{:%H:%M}"   # 狀態列時間格式
date_format           = "{:%a, %b %d}" # 狀態列日期格式 (例如: Fri, Oct 9)
offline_mode          = false
telemetry_enabled     = false        # 關閉任何遙測連線
niri_overview_type_to_launch_enabled = true # Niri 工作區鳥瞰時直接打字搜尋啟動

# 剪貼簿整合 (替代外部 cliphist，內建毛玻璃歷史選單)
clipboard_enabled     = true
clipboard_history_max_entries = 150
clipboard_keep_from_closed_apps = true
clipboard_auto_paste  = "auto"

shared_gl_context     = true

# 截圖工具 (Windows 剪取工具快捷鍵 Win+Shift+S 呼叫)
[shell.screenshot]
skip_annotate_on_copy_save = false
close_on_copy = true
close_on_save = true

# 動效與陰影 (物理彈簧柔和動效)
[shell.animation]
enabled = true
speed   = 1.0

[shell.shadow]
direction = "down"
alpha     = 0.55

# 懸浮島與面板排版
[shell.panel]
transparency_mode        = "glass"    # solid | soft | glass (微透毛玻璃)
borders                  = true
border_color             = "#ffffff14" # Linear 極細 1px 白高光 (8% 透明度)
border_width             = 1.0
shadow                   = true
launcher_placement       = "floating" # Spotlight 居中浮動啟動器
clipboard_placement      = "attached" # 剪貼簿附著於頂部狀態列下拉，不再於正中央懸浮大方塊
control_center_placement = "attached" # 頂部列吸附抽屜控制中心
wallpaper_placement      = "attached"
session_placement        = "attached"
launcher_position        = "center"
clipboard_position       = "auto"

# ── 控制中心與展開面板 (Caelestia Nexus 規格：多分頁導覽) ────────────────────
[control_center]
sidebar                  = "full"     # "full"：完整分類側邊欄導覽 (Dash, Media, Audio, System, Weather)
width                    = 880        # 控制中心面板展開寬度 (對齊 Caelestia Nexus minWidth 800 - 900)
show_shortcut_labels     = true       # 快捷捷徑圖示下方顯示標籤文字
show_session_button      = true       # 頂部顯示電源操作鈕

[[control_center.shortcuts]]
type = "wifi"

[[control_center.shortcuts]]
type = "bluetooth"

[[control_center.shortcuts]]
type = "nightlight"

[[control_center.shortcuts]]
type = "notification"

[[control_center.shortcuts]]
type = "caffeine"

[[control_center.shortcuts]]
type = "mic_mute"

[[control_center.shortcuts]]
type = "wallpaper"

[[control_center.shortcuts]]
type = "system"

# ── 通知系統 (Caelestia 右上角 430px 懸浮通知面板) ───────────────────────────
[notification]
enable_daemon            = true       # 接管通知守護進程
position                 = "top_right"# 移至右上角 (對齊 Caelestia NotifsTokens)
offset_x                 = 20         # 距離螢幕右側邊界 20px
offset_y                 = 52         # 避開頂部 38px 懸浮島與邊距
width                    = 430        # 橫向寬度 430px (精確複製 Caelestia NotifsTokens.width = 430)
max_visible              = 5          # 最多同時顯示 5 則通知
collapse_on_dismiss      = true       # 關閉單則通知時自動平滑折疊
keep_dismissed_in_history= true       # 關閉的通知仍保留在控制中心歷史紀錄

# ── 音量與亮度 OSD (Caelestia 右側居中/右下角滑桿) ───────────────────────────
[osd]
position                 = "bottom_right" # 靠右下角顯示 (對齊 Caelestia OSD Wrapper)
offset_x                 = 24
offset_y                 = 24

# ── 狀態列外觀 (Bar - Linear / Raycast 現代深碳黑極簡滿版列) ───────────────
[bar.default]
position               = "top"               # 頂部全寬
floating               = false               # 貼齊螢幕邊緣 (不浮空、無贅肉)
thickness              = 32                  # 高度 32px (精緻俐落、專業工作站質感)
margin_edge            = 0.0                 # 頂部邊距 0px
margin_ends            = 0.0                 # 左右邊距 0px
margin_opposite_edge   = 0.0
reserve_space          = true                # 保留專屬空間排擠視窗
radius                 = 0                   # 滿版直角無圓角
concave_edge_corners   = false
padding                = 12                  # 內容兩側留白
widget_spacing         = 10                  # 模組間距
border_width           = 1.0                 # 底部 1px 高光
border_color           = "#ffffff14"         # 8% 微弱高光白線
background             = "#0b0c0fee"         # Linear 深炭灰底色 (93% 不透明度)

# 佈局分組 (時間至中，指示器至左，托盤收合)
start                  = ["launcher", "workspaces", "active_window"]
center                 = ["clock"]
end                    = ["media", "tray", "network", "bluetooth", "battery", "volume", "session"]

# 模組容器樣式 (停用生硬包裹方塊，回歸純粹俐落)
capsule                = false
capsule_radius         = 0
capsule_padding        = 0
capsule_fill           = "transparent"
capsule_border_width   = 0.0
capsule_border_color   = "transparent"

[widget.launcher]
glyph                  = "apps"
color                  = "#8b949e"           # Muted gray

[widget.media]
artist_first           = true
art_size               = 18
max_length             = 180
hide_when_no_media     = true
hide_when_idle         = false
rotate_album_art       = false
color                  = "#e6edf3"           # Crisp silver white

[widget.workspaces]
style                  = "focus_hint"
hide_empty             = false
show_labels            = true
show_icons             = false
pill_scale             = 1.0
active_pill_size       = 2.2
inactive_pill_size     = 1.0
capsule_padding        = 6
active_color           = "#ffffff"           # 當前焦點：純淨亮白
inactive_color         = "#484f58"           # 閒置工作區：低調冷灰

[widget.active_window]
max_length             = 40
color                  = "#8b949e"           # 次級文字灰

[widget.clock]
format                 = "%H:%M  •  %a, %b %d"
color                  = "#ffffff"           # 居中時鐘純淨亮白

[widget.volume]
color                  = "#8b949e"

[widget.brightness]
color                  = "#8b949e"

[widget.network]
color                  = "#8b949e"

[widget.bluetooth]
color                  = "#8b949e"

[widget.battery]
color                  = "#8b949e"

[widget.tray]
drawer                 = true
drawer_columns         = 3
chevron_color          = "#8b949e"
icon_size              = 16

[widget.clipboard]
color                  = "#8b949e"

[widget.session]
color                  = "#8b949e"

# Spotlight 居中搜尋啟動器 (Win 鍵喚出)
[shell.launcher]
categories                 = true
show_icons                 = true
show_app_origin_indicator  = true
compact                    = false
app_grid                   = false
sort_by_usage              = true
pinned                     = ["kitty", "org.gnome.Nautilus", "google-chrome", "firefox"]
fetch_exchange_rates       = false
provider_prefix            = "/"
auto_paste                 = "auto"

[shell.launcher.providers.calculator]
prefix = "calc"
global = true                         # 直接在搜尋列計算算式 (如 128*4)

[shell.launcher.providers.emoji]
prefix = "emo"

[shell.launcher.providers.session]
prefix = "session"
global = true                         # 支援直接搜尋 lock / reboot / poweroff

[shell.launcher.providers.windows]
prefix = "win"

[shell.launcher.providers.wallpaper]
prefix = "wall"

# 視窗預覽與循環切換 (Alt+Tab)
[shell.window_switcher]
style        = "carousel"             # 3D 景深輪播切換視窗
mru          = true                   # 最近使用順序
show_caption = true
show_count   = true
show_app_icon = true

# ── 動態桌布守護 (Wallpaper Daemon) ──────────────────────────────────────────
[wallpaper]
enabled             = true
fill_mode           = "crop"
transition          = ["fade", "zoom", "honeycomb"]
transition_duration = 1200
edge_smoothness     = 0.3
directory           = "~/Pictures/Wallpapers"

[wallpaper.automation]
enabled                    = false
interval_seconds           = 1800
order                      = "random"
recursive                  = true

# ── 即時天氣服務 (Caelestia Weather Tab) ──────────────────────────────────────
[weather]
enabled             = true

# ── 系統效能監控 (Caelestia Performance Tab) ──────────────────────────────────
[system.monitor]
cpu_poll_seconds    = 2.0
memory_poll_seconds = 2.0
network_poll_seconds= 3.0
disk_poll_seconds   = 10.0

# ── 主題配色 (Caelestia Material You M3 莫蘭迪深色底襯與暗色系面板) ─────────
[theme]
mode       = "dark"                       # 深色模式：應用程式、Launcher 與彈出視窗呈現深邃莫蘭迪風格
shell_mode = "dark"                       # 控制中心、剪貼簿選單等外殼浮動面板使用深色莫蘭迪模式
source     = "builtin"
