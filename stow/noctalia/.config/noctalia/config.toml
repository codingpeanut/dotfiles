# =============================================================================
# Noctalia Shell Configuration (v5+)
# Niri + Wayland 現代微透桌面 (Debian / Fedora)
# 風格：Tokyo Night (東京之夜深色系) + 微透毛玻璃 (Glassmorphism)
# 架構：GNU Stow + Justfile
# =============================================================================

# ── 無障礙與縮放 ─────────────────────────────────────────────────────────────
[accessibility]
ui_scale              = 1.0
high_contrast         = false

# ── 外殼核心設定 (Shell Core) ────────────────────────────────────────────────
[shell]
corner_radius_scale   = 1.25         # 圓角半徑縮放 (12-16px 柔和圓角)
font_family           = "JetBrainsMono Nerd Font, Noto Sans CJK TC, sans-serif"
time_format           = "{:%H:%M}"   # 狀態列時間格式
date_format           = "%A, %m/%d"  # 狀態列日期格式
offline_mode          = false
telemetry_enabled     = false        # 關閉任何遙測連線
niri_overview_type_to_launch_enabled = true # Niri 工作區鳥瞰時直接打字搜尋啟動

# 剪貼簿整合 (替代外部 cliphist，內建毛玻璃歷史選單)
clipboard_enabled     = true
clipboard_history_max_entries = 150
clipboard_keep_from_closed_apps = true
clipboard_auto_paste  = "auto"

shared_gl_context     = true

# 截圖工具 (Windows 剪取工具快捷鍵 Win+Shift+S 呼叫)
[shell.screenshot]
skip_annotate_on_copy_save = false
close_on_copy = true
close_on_save = true

# 動效與陰影 (物理彈簧柔和動效)
[shell.animation]
enabled = true
speed   = 1.0

[shell.shadow]
direction = "down"
alpha     = 0.55

# 懸浮島與面板排版
[shell.panel]
transparency_mode        = "glass"    # solid | soft | glass (微透毛玻璃)
borders                  = true
border_color             = "#7aa2f7"  # Tokyo Night 藍色邊框微發光
border_width             = 1.0
shadow                   = true
launcher_placement       = "floating" # Spotlight 居中浮動啟動器
clipboard_placement      = "attached" # 剪貼簿附著於頂部狀態列下拉，不再於正中央懸浮大方塊
control_center_placement = "attached" # 頂部列吸附抽屜控制中心
wallpaper_placement      = "attached"
session_placement        = "attached"
launcher_position        = "center"
clipboard_position       = "auto"

# ── 控制中心與展開面板 (Caelestia Nexus 規格：寬度 950px 多分頁導覽) ────────
[control_center]
sidebar                  = "full"     # "full"：完整分類側邊欄導覽 (Dash, Media, Audio, System, Weather)
width                    = 950        # 控制中心面板展開寬度 (預設 700 -> 950px，最大支援 1200)
show_shortcut_labels     = true       # 快捷捷徑圖示下方顯示標籤文字
show_session_button      = true       # 頂部顯示電源操作鈕

[[control_center.shortcuts]]
type = "wifi"

[[control_center.shortcuts]]
type = "bluetooth"

[[control_center.shortcuts]]
type = "nightlight"

[[control_center.shortcuts]]
type = "notification"

[[control_center.shortcuts]]
type = "caffeine"

[[control_center.shortcuts]]
type = "mic_mute"

[[control_center.shortcuts]]
type = "wallpaper"

[[control_center.shortcuts]]
type = "system"

# ── 通知系統 (移至右上角並橫向加寬至 420px，不遮擋正中央視窗) ────────────────
[notification]
enable_daemon            = true       # 接管通知守護進程
position                 = "top_right"# 移至右上角，告別螢幕正中間突兀感
offset_x                 = 20         # 距離螢幕右側邊界 20px
offset_y                 = 46         # 避開頂部 34px 狀態列
width                    = 420        # 橫向加寬 (預設 360 -> 420px)，讓訊息內容橫向舒展
max_visible              = 5          # 最多同時顯示 5 則通知
collapse_on_dismiss      = true       # 關閉單則通知時自動平滑折疊
keep_dismissed_in_history= true       # 關閉的通知仍保留在控制中心歷史紀錄

# ── 音量與亮度 OSD (靠右下角顯示，避免在中央彈出) ─────────────────────────────
[osd]
position                 = "bottom_right" # 移至右下角，避免遮擋中央視覺重心
offset_x                 = 24
offset_y                 = 24

# ── 狀態列外觀 (Bar - 全寬頂部狀態列，對齊 Waybar 佈局與 Tokyo Night 膠囊樣式) ───
[bar.default]
position               = "top"
floating               = false               # 關鍵開關：關閉浮動島模式，啟用 Dock 全寬貼邊
thickness              = 34                  # 高度 34px (同 Waybar height: 34)
margin_edge            = 0.0                 # 頂部外距 0 (全寬貼齊螢幕頂部邊緣)
margin_ends            = 0.0                 # 左右邊界 0 (全寬 100% 橫跨整個螢幕)
margin_opposite_edge   = 0.0
reserve_space          = true                # 保留專屬空間排擠視窗
radius                 = 0                   # 全寬無外框圓角
concave_edge_corners   = false               # 停用內縮圓角
padding                = 10                  # 兩側內容內縮 10px，避免模組緊貼螢幕邊界
widget_spacing         = 6                   # 模組之間的間距
border_width           = 1.0                 # 下邊框 1px
border_color           = "#ffffff1a"         # 10% 微透白色下邊框
background             = "#1a1b26d9"         # Tokyo Night 半透明微透毛玻璃 (85% 不透明度)

# 佈局分組 (對齊 Caelestia 膠囊藥丸分佈)
start                  = ["launcher", "workspaces", "active_window"]
center                 = ["clock"]
end                    = ["media", "volume", "brightness", "network", "bluetooth", "battery", "tray", "clipboard", "session"]

# 膠囊模組外觀 (模仿 Caelestia 獨立膠囊 pill 與樣式)
capsule                = true
capsule_radius         = 6
capsule_padding        = 10
capsule_fill           = "#24283bd9"         # Tokyo Night 模組獨立微透膠囊底色 (深色 85% 不透明度)
capsule_border_width   = 0

[widget.launcher]
glyph                  = "apps"              # Caelestia 應用啟動膠囊圖示
color                  = "#7aa2f7"

[widget.media]
artist_first           = true
art_size               = 18
max_length             = 200
hide_when_no_media     = true
hide_when_idle         = false
rotate_album_art       = true
color                  = "#bb9af7"

[widget.workspaces]
style                  = "regular"
hide_empty             = false
show_labels            = true
pill_scale             = 1.1                 # 微微拉大厚度
active_pill_size       = 3.2                 # 當前頁面指示器加寬 (預設 2.2 -> 3.2)
inactive_pill_size     = 1.6                 # 其他頁面指示器加寬 (預設 1.0 -> 1.6)
capsule_padding        = 12                  # 兩側 padding 加寬
active_color           = "#7aa2f7"
inactive_color         = "#565f89"

[widget.active_window]
max_length             = 50
color                  = "#7dcfff"

[widget.clock]
format                 = " %H:%M  󰃭 %Y-%m-%d"
color                  = "#bb9af7"

[widget.volume]
color                  = "#7aa2f7"

[widget.brightness]
color                  = "#e0af68"

[widget.network]
color                  = "#7dcfff"

[widget.bluetooth]
color                  = "#7aa2f7"

[widget.battery]
color                  = "#9ece6a"

[widget.tray]
icon_size              = 16

[widget.clipboard]
color                  = "#7aa2f7"

[widget.session]
color                  = "#f7768e"

# Spotlight 居中搜尋啟動器 (Win 鍵喚出)
[shell.launcher]
categories                 = true
show_icons                 = true
show_app_origin_indicator  = true
compact                    = false
app_grid                   = false
sort_by_usage              = true
pinned                     = ["kitty", "org.gnome.Nautilus", "google-chrome", "firefox"]
fetch_exchange_rates       = false
provider_prefix            = "/"
auto_paste                 = "auto"

[shell.launcher.providers.calculator]
prefix = "calc"
global = true                         # 直接在搜尋列計算算式 (如 128*4)

[shell.launcher.providers.emoji]
prefix = "emo"

[shell.launcher.providers.session]
prefix = "session"
global = true                         # 支援直接搜尋 lock / reboot / poweroff

[shell.launcher.providers.windows]
prefix = "win"

[shell.launcher.providers.wallpaper]
prefix = "wall"

# 視窗預覽與循環切換 (Alt+Tab)
[shell.window_switcher]
style        = "carousel"             # 3D 景深輪播切換視窗
mru          = true                   # 最近使用順序
show_caption = true
show_count   = true
show_app_icon = true

# ── 動態桌布守護 (Wallpaper Daemon) ──────────────────────────────────────────
[wallpaper]
enabled             = true
fill_mode           = "crop"
transition          = ["fade", "zoom", "honeycomb"]
transition_duration = 1200
edge_smoothness     = 0.3
directory           = "~/Pictures/Wallpapers"

[wallpaper.automation]
enabled                    = false
interval_seconds           = 1800
order                      = "random"
recursive                  = true

# ── 即時天氣服務 (Caelestia Weather Tab) ──────────────────────────────────────
[weather]
enabled             = true

# ── 系統效能監控 (Caelestia Performance Tab) ──────────────────────────────────
[system.monitor]
cpu_poll_seconds    = 2.0
memory_poll_seconds = 2.0
network_poll_seconds= 3.0
disk_poll_seconds   = 10.0

# ── 主題配色 (Bar 為深色，其他組件/面板為淺色風格) ───────────────────────────
[theme]
mode       = "light"                      # 淺色模式：應用程式、Launcher 與彈出視窗呈現淺色風格
shell_mode = "light"                      # 控制中心、剪貼簿選單等外殼浮動面板使用淺色模式
source     = "builtin"
