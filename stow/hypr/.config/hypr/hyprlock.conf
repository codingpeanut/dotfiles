# =============================================================================
# Hyprlock 鎖定畫面設定 (Catppuccin Mocha 毛玻璃快照風格)
# =============================================================================

general {
    disable_loading_bar = true
    hide_cursor = true
    grace = 2
    no_fade_in = false
}

# 動態桌面截圖模糊背景
background {
    monitor =
    path = screenshot
    blur_passes = 3
    blur_size = 7
    noise = 0.015
    contrast = 0.90
    brightness = 0.78
    vibrancy = 0.2
}

# 時間顯示 (超大字級)
label {
    monitor =
    text = $TIME
    color = rgb(192, 202, 245)
    font_size = 72
    font_family = JetBrainsMono Nerd Font Bold
    position = 0, 140
    halign = center
    valign = center
}

# 日期顯示
label {
    monitor =
    text = cmd[update:43200000] echo "$(date +"%A, %B %d日")"
    color = rgb(122, 162, 247)
    font_size = 18
    font_family = JetBrainsMono Nerd Font
    position = 0, 75
    halign = center
    valign = center
}

# 密碼輸入框 (精緻圓角與微透底色)
input-field {
    monitor =
    size = 280, 48
    outline_thickness = 2
    dots_size = 0.28
    dots_spacing = 0.25
    dots_center = true
    outer_color = rgb(122, 162, 247)
    inner_color = rgba(26, 27, 38, 0.85)
    font_color = rgb(192, 202, 245)
    fade_on_empty = false
    placeholder_text = <i>輸入密碼解鎖...</i>
    hide_input = false
    rounding = 14
    check_color = rgb(158, 206, 106)
    fail_color = rgb(247, 118, 142)
    fail_text = <i>密碼錯誤 ($ATTEMPTS)</i>
    position = 0, -20
    halign = center
    valign = center
}
