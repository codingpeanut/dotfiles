# Fuzzel launcher configuration
# Managed by dotfiles

[main]
font=JetBrainsMono Nerd Font:size=13
dpi-aware=auto
prompt="❯ "
icon-theme=Papirus-Dark
icons-enabled=yes
show-actions=yes
terminal=kitty -e
lines=10
width=64
horizontal-pad=24
vertical-pad=14
inner-pad=10
image-size-ratio=0.5

[colors]
background=141218f2
text=cac4d0ff
match=d0bcffff
selection=211f26f8
selection-text=e6e1e5ff
selection-match=d0bcffff
border=d0bcff40

[border]
width=2
radius=14
