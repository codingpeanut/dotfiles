# GNOME declarative settings (loaded into /org/gnome/)
#
# Capture the current desktop state back into this file:  just gnome-backup
# Apply this file to the desktop:                          just gnome-apply
# Reset everything to defaults:                            just gnome-reset

[desktop/interface]
color-scheme='prefer-light'
gtk-theme='Colloid-Grey-Light'
icon-theme='Papirus-Light'
cursor-theme='Bibata-Modern-Ice'
cursor-size=24
font-name='Inter 11'
document-font-name='Inter 11'
monospace-font-name='JetBrainsMono Nerd Font 11'
accent-color='blue'
clock-format='24h'
clock-show-weekday=true
clock-show-seconds=false
enable-animations=true

[desktop/wm/preferences]
button-layout=':minimize,maximize,close'
num-workspaces=4

# Windows 11-style window shortcuts. PaperWM is disabled by default (see
# gnome/extensions-disabled.txt), so Mutter handles the native snap tiling.
# Win+Left/Right = snap halves, Win+Up/Down = maximize/restore,
# Win+Ctrl+Left/Right = switch workspace, Win+Ctrl+Shift+Left/Right = move window.
# Super+1..9 are reserved for pinned taskbar apps in [shell/keybindings].
[desktop/wm/keybindings]
toggle-maximized=['<Alt>F10']
maximize=['<Super>Up']
unmaximize=['<Super>Down', '<Alt>F5']
show-desktop=['<Super>d']
minimize=['<Super>h']
switch-to-workspace-left=['<Super><Ctrl>Left']
switch-to-workspace-right=['<Super><Ctrl>Right']
move-to-workspace-left=['<Super><Ctrl><Shift>Left']
move-to-workspace-right=['<Super><Ctrl><Shift>Right']
switch-to-workspace-1=@as []
switch-to-workspace-2=@as []
switch-to-workspace-3=@as []
switch-to-workspace-4=@as []
move-to-workspace-1=@as []
move-to-workspace-2=@as []
move-to-workspace-3=@as []
move-to-workspace-4=@as []
# Alt+Tab stays the app switcher; Super+Tab is freed for the overview.
switch-applications=['<Alt>Tab']
switch-applications-backward=['<Alt><Shift>Tab']
# Windows Win+R run dialog (Alt+F2 kept for GNOME muscle memory).
panel-run-dialog=['<Alt>F2', '<Super>r']

# Native Mutter snap tiling (PaperWM suspends these while enabled).
[mutter/keybindings]
toggle-tiled-left=['<Super>Left']
toggle-tiled-right=['<Super>Right']

[desktop/input-sources]
sources=[('xkb', 'us'), ('ibus', 'chewing')]
mru-sources=[('ibus', 'chewing'), ('xkb', 'us')]

[shell]
favorite-apps=['org.gnome.Nautilus.desktop', 'com.discordapp.Discord.desktop', 'code.desktop', 'google-chrome.desktop', 'com.mattjakeman.ExtensionManager.desktop']
# Dash to Dock and PaperWM stay installed but disabled by default; see
# gnome/extensions-disabled.txt. Remove the UUID there, then move it from
# disabled-extensions to enabled-extensions before `just gnome-apply`.
enabled-extensions=['blur-my-shell@aunetx', 'just-perfection-desktop@just-perfection', 'appindicatorsupport@rgcjonas.gmail.com', 'caffeine@patapon.info', 'clipboard-history@alexsaveau.dev', 'hide-bluetooth-indicator@codingpeanut.github.io']
disabled-extensions=['dash-to-dock@micxgx.gmail.com', 'paperwm@paperwm.github.com']

# Windows 11-style shell shortcuts:
# Win+Tab / Win+S overview, Win+A quick settings, Win+N notifications,
# Win+1..9 pinned taskbar apps, Win+Shift+1..9 new instance,
# Win+Shift+S screenshot UI, Win+Print full screenshot.
# Super+Tab is freed for the overview by keeping Alt+Tab as the app switcher
# and clearing the app-grid shortcut that used to live on Super+A.
[shell/keybindings]
toggle-overview=['<Super>Tab', '<Super>s']
toggle-quick-settings=['<Super>a']
toggle-message-tray=['<Super>n']
focus-active-notification=@as []
toggle-application-view=@as []
switch-to-application-1=['<Super>1']
switch-to-application-2=['<Super>2']
switch-to-application-3=['<Super>3']
switch-to-application-4=['<Super>4']
switch-to-application-5=['<Super>5']
switch-to-application-6=['<Super>6']
switch-to-application-7=['<Super>7']
switch-to-application-8=['<Super>8']
switch-to-application-9=['<Super>9']
open-new-window-application-1=['<Super><Shift>1']
open-new-window-application-2=['<Super><Shift>2']
open-new-window-application-3=['<Super><Shift>3']
open-new-window-application-4=['<Super><Shift>4']
open-new-window-application-5=['<Super><Shift>5']
open-new-window-application-6=['<Super><Shift>6']
open-new-window-application-7=['<Super><Shift>7']
open-new-window-application-8=['<Super><Shift>8']
open-new-window-application-9=['<Super><Shift>9']
show-screenshot-ui=['Print', '<Super><Shift>s']
screenshot=['<Super>Print', '<Shift>Print']

[settings-daemon/plugins/media-keys]
# Win+L lock; Win+E file manager and Win+I Settings are extra Windows keys.
# Super+T terminal and Ctrl+Shift+Esc system monitor are kept as conveniences.
screensaver=['<Super>l']
custom-keybindings=['/org/gnome/settings-daemon/plugins/media-keys/custom-keybindings/custom0/', '/org/gnome/settings-daemon/plugins/media-keys/custom-keybindings/custom1/', '/org/gnome/settings-daemon/plugins/media-keys/custom-keybindings/custom2/', '/org/gnome/settings-daemon/plugins/media-keys/custom-keybindings/custom3/']

[settings-daemon/plugins/media-keys/custom-keybindings/custom0]
binding='<Control><Shift>Escape'
command='gnome-system-monitor'
name='System Monitor'

[settings-daemon/plugins/media-keys/custom-keybindings/custom1]
binding='<Super>t'
command='ptyxis'
name='Terminal'

[settings-daemon/plugins/media-keys/custom-keybindings/custom2]
binding='<Super>e'
command='nautilus --new-window'
name='File Manager'

[settings-daemon/plugins/media-keys/custom-keybindings/custom3]
binding='<Super>i'
command='gnome-control-center'
name='Settings'

# Windows Win+V: clipboard history (extension default was Super+Shift+V).
[shell/extensions/clipboard-history]
toggle-menu=['<Super>v']

# --- Extension visual tweaks for the minimal glass look ---
# These can be regenerated after manual tuning with: just gnome-backup
# - panel/popup: dynamic blur type; rounded corners of the dynamic layer
#   come from the gnome-rounded-blur helper (see README)
# - blur-my-shell dash-to-dock: dynamic blur (same live blur layer as the
#   panel), dock background cleared by BMS so the blurred layer shows
#   through; settings-version=2 pins the settings so BMS's one-time
#   migration cannot flip the dash back to static blur
# - just-perfection: dash-icon-size 0 = shell default (dash sizing is
#   left to Dash to Dock)
# - dash-to-dock: disabled by default; when enabled, bottom dock with
#   autohide (reveal by touching the bottom screen edge)
# - paperwm: optional mode (disabled by default). Slim glass selection ring
#   around the focused window (color from stow/gnome/.config/paperwm/user.css);
#   niri-style keybindings are retained below for when PaperWM is re-enabled

[shell/extensions/blur-my-shell]
settings-version=2

[shell/extensions/blur-my-shell/panel]
blur=true
static-blur=false

[shell/extensions/blur-my-shell/popup]
blur=true
static-blur=false

[shell/extensions/blur-my-shell/dash-to-dock]
blur=true
static-blur=false
override-background=true
style-dash-to-dock=0

[shell/extensions/just-perfection]
dash-icon-size=0

[shell/extensions/paperwm]
selection-border-size=4
selection-border-radius-top=16
selection-border-radius-bottom=16

# PaperWM is installed but disabled by default (Windows 11 mode). These niri
# keybindings are retained for an optional re-enable; they have no effect while
# PaperWM is disabled. To use them, remove paperwm from extensions-disabled.txt,
# move it back to enabled-extensions, and re-apply the PaperWM profile.
# niri default keybindings mapped onto PaperWM (Mod = Super):
# focus=Super+arrows/HJKL, move=Super+Ctrl+arrows/HJKL, monitors=Super+Shift(+Ctrl),
# slurp/barf=Super+,/.,  drift=Super+[/], workspaces=Super+Page/U/I,
# width=Super+R(+Shift), height=Super+Ctrl+Shift+R, resize=Super+(Shift+)minus/equal,
# center=Super+C, float=Super+V, close=Super+Q, duplicate=Super+Return.
[shell/extensions/paperwm/keybindings]
switch-left=['<Super>Left', '<Super>h']
switch-right=['<Super>Right', '<Super>l']
switch-up=['<Super>Up', '<Super>k']
switch-down=['<Super>Down', '<Super>j']
switch-monitor-left=['<Super><Shift>Left', '<Super><Shift>h']
switch-monitor-right=['<Super><Shift>Right', '<Super><Shift>l']
switch-monitor-above=['<Super><Shift>Up', '<Super><Shift>k']
switch-monitor-below=['<Super><Shift>Down', '<Super><Shift>j']
move-left=['<Super><Ctrl>Left', '<Super><Ctrl>h']
move-right=['<Super><Ctrl>Right', '<Super><Ctrl>l']
move-up=['<Super><Ctrl>Up', '<Super><Ctrl>k']
move-down=['<Super><Ctrl>Down', '<Super><Ctrl>j']
move-monitor-left=['<Super><Shift><Ctrl>Left', '<Super><Shift><Ctrl>h']
move-monitor-right=['<Super><Shift><Ctrl>Right', '<Super><Shift><Ctrl>l']
move-monitor-above=['<Super><Shift><Ctrl>Up', '<Super><Shift><Ctrl>k']
move-monitor-below=['<Super><Shift><Ctrl>Down', '<Super><Shift><Ctrl>j']
switch-first=['<Super>Home']
switch-last=['<Super>End']
switch-down-workspace=['<Super>Page_Down', '<Super>u']
switch-up-workspace=['<Super>Page_Up', '<Super>i']
move-down-workspace=['<Super><Ctrl>Page_Down', '<Super><Ctrl>u']
move-up-workspace=['<Super><Ctrl>Page_Up', '<Super><Ctrl>i']
drift-left=['<Super>bracketleft']
drift-right=['<Super>bracketright']
slurp-in=['<Super>comma']
barf-out=['<Super>period']
barf-out-active=@as []
switch-next=@as []
switch-previous=@as []
take-window=@as []
new-window=['<Super>Return']
close-window=['<Super>q', '<Super>BackSpace']
cycle-width=['<Super>r']
cycle-width-backwards=['<Super><Shift>r']
cycle-height=['<Super><Ctrl><Shift>r']
cycle-height-backwards=['<Super><Alt><Shift>r']
resize-w-dec=['<Super>minus']
resize-w-inc=['<Super>plus', '<Super>equal']
resize-h-dec=['<Super><Shift>minus']
resize-h-inc=['<Super><Shift>plus', '<Super><Shift>equal']
center=['<Super>c']
center-horizontally=@as []
center-vertically=@as []
toggle-maximize-width=['<Super>f']
paper-toggle-fullscreen=['<Super><Shift>f']
toggle-scratch-window=['<Super>v']
toggle-scratch-layer=['<Super><Shift>Escape']

[shell/extensions/dash-to-dock]
dock-position='BOTTOM'
autohide=true
intellihide=false
dash-max-icon-size=48
# 讓位：D2D 預設 hot-keys（Super+數字）與 shortcut=['<Super>q']（顯示 dock）比 PaperWM 先註冊而贏走按鍵
hot-keys=false
shortcut=@as []
