# GNOME declarative settings (loaded into /org/gnome/)
#
# Capture the current desktop state back into this file:  just gnome-backup
# Apply this file to the desktop:                          just gnome-apply
# Reset everything to defaults:                            just gnome-reset

[desktop/interface]
color-scheme='prefer-dark'
gtk-theme='Colloid-Dark'
icon-theme='Papirus-Dark'
cursor-theme='Bibata-Modern-Ice'
cursor-size=24
font-name='Inter 11'
document-font-name='Inter 11'
monospace-font-name='JetBrainsMono Nerd Font 11'
accent-color='blue'
clock-format='24h'
clock-show-weekday=true
clock-show-seconds=false
enable-animations=true

[desktop/wm/preferences]
button-layout=':minimize,maximize,close'
num-workspaces=4

# niri-style: Mod+M maximize; Mod+N switch workspace, Mod+Ctrl+N move column there.
# maximize/unmaximize keep GNOME defaults (Super+Up/Down): while PaperWM is enabled
# those clash with its switch-up/down and get auto-suspended/restored by PaperWM.
[desktop/wm/keybindings]
toggle-maximized=['<Super>m', '<Alt>F10']
switch-to-workspace-1=['<Super>1']
switch-to-workspace-2=['<Super>2']
switch-to-workspace-3=['<Super>3']
switch-to-workspace-4=['<Super>4']
move-to-workspace-1=['<Super><Ctrl>1']
move-to-workspace-2=['<Super><Ctrl>2']
move-to-workspace-3=['<Super><Ctrl>3']
move-to-workspace-4=['<Super><Ctrl>4']

[desktop/background]
picture-uri='file:///usr/share/backgrounds/gnome/adwaita-l.jxl'
picture-uri-dark='file:///usr/share/backgrounds/gnome/adwaita-d.jxl'

[shell]
favorite-apps=['org.gnome.Nautilus.desktop', 'com.discordapp.Discord.desktop', 'code.desktop', 'google-chrome.desktop', 'com.mattjakeman.ExtensionManager.desktop']
enabled-extensions=['blur-my-shell@aunetx', 'just-perfection-desktop@just-perfection', 'appindicatorsupport@rgcjonas.gmail.com', 'dash-to-dock@micxgx.gmail.com', 'caffeine@patapon.info', 'paperwm@paperwm.github.com', 'clipboard-history@alexsaveau.dev', 'hide-bluetooth-indicator@codingpeanut.github.io']

# niri-style: Mod+O overview; Mod+Shift+P screenshot UI; Super+1..9 freed for
# workspace switching and Super+V/M for PaperWM scratch/maximize, so the GNOME
# app-launcher and notification-tray shortcuts are cleared; Ctrl+Print takes an
# instant full-screen screenshot (niri: Ctrl+Print = screenshot-screen).
[shell/keybindings]
toggle-overview=['<Super>o']
toggle-message-tray=@as []
switch-to-application-1=@as []
switch-to-application-2=@as []
switch-to-application-3=@as []
switch-to-application-4=@as []
switch-to-application-5=@as []
switch-to-application-6=@as []
switch-to-application-7=@as []
switch-to-application-8=@as []
switch-to-application-9=@as []
open-new-window-application-1=@as []
open-new-window-application-2=@as []
open-new-window-application-3=@as []
open-new-window-application-4=@as []
show-screenshot-ui=['Print', '<Super><Shift>p']
screenshot=['<Ctrl>Print']

[settings-daemon/plugins/media-keys]
screensaver=['<Super><Alt>l']
custom-keybindings=['/org/gnome/settings-daemon/plugins/media-keys/custom-keybindings/custom0/', '/org/gnome/settings-daemon/plugins/media-keys/custom-keybindings/custom1/']

[settings-daemon/plugins/media-keys/custom-keybindings/custom0]
binding='<Control><Shift>Escape'
command='gnome-system-monitor'
name='System Monitor'

[settings-daemon/plugins/media-keys/custom-keybindings/custom1]
binding='<Super>t'
command='ptyxis'
name='Terminal'

# --- Extension visual tweaks for the minimal glass look ---
# These can be regenerated after manual tuning with: just gnome-backup
# - panel/popup: dynamic blur type; rounded corners of the dynamic layer
#   come from the gnome-rounded-blur helper (see README)
# - blur-my-shell dash-to-dock: dynamic blur (same live blur layer as the
#   panel), dock background cleared by BMS so the blurred layer shows
#   through; settings-version=2 pins the settings so BMS's one-time
#   migration cannot flip the dash back to static blur
# - just-perfection: dash-icon-size 0 = shell default (dash sizing is
#   left to Dash to Dock)
# - dash-to-dock: bottom dock with autohide (reveal by touching the
#   bottom screen edge)
# - paperwm: slim glass selection ring around the focused window (color
#   comes from stow/gnome/.config/paperwm/user.css)
# - paperwm keybindings: niri-style (see README); PaperWM suspends clashing
#   GNOME binds while enabled and restores them when disabled

[shell/extensions/blur-my-shell]
settings-version=2

[shell/extensions/blur-my-shell/panel]
blur=true
static-blur=false

[shell/extensions/blur-my-shell/popup]
blur=true
static-blur=false

[shell/extensions/blur-my-shell/dash-to-dock]
blur=true
static-blur=false
override-background=true
style-dash-to-dock=0

[shell/extensions/just-perfection]
dash-icon-size=0

[shell/extensions/paperwm]
selection-border-size=4
selection-border-radius-top=16
selection-border-radius-bottom=16

# niri default keybindings mapped onto PaperWM (Mod = Super):
# focus=Super+arrows/HJKL, move=Super+Ctrl+arrows/HJKL, monitors=Super+Shift(+Ctrl),
# slurp/barf=Super+,/.,  drift=Super+[/], workspaces=Super+Page/U/I,
# width=Super+R(+Shift), height=Super+Ctrl+Shift+R, resize=Super+(Shift+)minus/equal,
# center=Super+C, float=Super+V, close=Super+Q, duplicate=Super+Return.
[shell/extensions/paperwm/keybindings]
switch-left=['<Super>Left', '<Super>h']
switch-right=['<Super>Right', '<Super>l']
switch-up=['<Super>Up', '<Super>k']
switch-down=['<Super>Down', '<Super>j']
switch-monitor-left=['<Super><Shift>Left', '<Super><Shift>h']
switch-monitor-right=['<Super><Shift>Right', '<Super><Shift>l']
switch-monitor-above=['<Super><Shift>Up', '<Super><Shift>k']
switch-monitor-below=['<Super><Shift>Down', '<Super><Shift>j']
move-left=['<Super><Ctrl>Left', '<Super><Ctrl>h']
move-right=['<Super><Ctrl>Right', '<Super><Ctrl>l']
move-up=['<Super><Ctrl>Up', '<Super><Ctrl>k']
move-down=['<Super><Ctrl>Down', '<Super><Ctrl>j']
move-monitor-left=['<Super><Shift><Ctrl>Left', '<Super><Shift><Ctrl>h']
move-monitor-right=['<Super><Shift><Ctrl>Right', '<Super><Shift><Ctrl>l']
move-monitor-above=['<Super><Shift><Ctrl>Up', '<Super><Shift><Ctrl>k']
move-monitor-below=['<Super><Shift><Ctrl>Down', '<Super><Shift><Ctrl>j']
switch-first=['<Super>Home']
switch-last=['<Super>End']
switch-down-workspace=['<Super>Page_Down', '<Super>u']
switch-up-workspace=['<Super>Page_Up', '<Super>i']
move-down-workspace=['<Super><Ctrl>Page_Down', '<Super><Ctrl>u']
move-up-workspace=['<Super><Ctrl>Page_Up', '<Super><Ctrl>i']
drift-left=['<Super>bracketleft']
drift-right=['<Super>bracketright']
slurp-in=['<Super>comma']
barf-out=['<Super>period']
barf-out-active=@as []
switch-next=@as []
switch-previous=@as []
take-window=@as []
new-window=['<Super>Return']
close-window=['<Super>q', '<Super>BackSpace']
cycle-width=['<Super>r']
cycle-width-backwards=['<Super><Shift>r']
cycle-height=['<Super><Ctrl><Shift>r']
cycle-height-backwards=['<Super><Alt><Shift>r']
resize-w-dec=['<Super>minus']
resize-w-inc=['<Super>plus', '<Super>equal']
resize-h-dec=['<Super><Shift>minus']
resize-h-inc=['<Super><Shift>plus', '<Super><Shift>equal']
center=['<Super>c']
center-horizontally=@as []
center-vertically=@as []
toggle-maximize-width=['<Super>f']
paper-toggle-fullscreen=['<Super><Shift>f']
toggle-scratch-window=['<Super>v']
toggle-scratch-layer=['<Super><Shift>Escape']

[shell/extensions/dash-to-dock]
dock-position='BOTTOM'
autohide=true
intellihide=false
dash-max-icon-size=48
