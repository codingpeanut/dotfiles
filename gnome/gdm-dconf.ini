# GDM greeter settings (installed to /etc/dconf/db/gdm.d/90-dotfiles by scripts/gdm-theme.sh)
# Scope: the gdm dconf profile (system-db:gdm) — Fedora ships this hook out of the box,
# so these survive gnome-shell package updates (unlike the gresource background patch).
#
# Mirror of the desktop look (gnome/dconf.ini [desktop/interface]) so the login screen
# blends with the session: dark scheme, same font, same cursor and accent color.

[org/gnome/desktop/interface]
color-scheme='prefer-dark'
font-name='Inter 11'
document-font-name='Inter 11'
icon-theme='Papirus-Dark'
cursor-theme='Bibata-Modern-Ice'
cursor-size=24
accent-color='blue'
