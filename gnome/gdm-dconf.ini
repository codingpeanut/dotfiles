# GDM greeter settings (installed to /etc/dconf/db/gdm.d/90-dotfiles by scripts/gdm-theme.sh)
# Scope: the gdm dconf profile (system-db:gdm) — Fedora ships this hook out of the box,
# so these survive gnome-shell package updates (unlike the gresource background patch).
#
# Light login screen: color-scheme=prefer-light makes the greeter load
# gnome-shell-light.css from the shell theme gresource (GNOME 50 picks the variant
# file from this setting); scripts/gdm-theme.sh embeds the desktop wallpaper into
# that same file. Same font, cursor, and accent color as the session
# (gnome/dconf.ini [desktop/interface]) so the login screen blends with the desktop.

[org/gnome/desktop/interface]
color-scheme='prefer-light'
font-name='Inter 11'
document-font-name='Inter 11'
icon-theme='Papirus'
cursor-theme='Bibata-Modern-Ice'
cursor-size=24
accent-color='blue'
