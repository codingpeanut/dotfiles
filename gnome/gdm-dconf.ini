# greeter-only dconf settings.
#
# This file is installed VERBATIM as /etc/dconf/db/gdm.d/90-dotfiles by
# scripts/gdm-theme.sh. Use it for greeter-ONLY settings that must not apply to
# the desktop, e.g.:
#
#   [org/gnome/login-screen]
#   banner-message-enable=true
#   banner-message-text='...'
#
# Anything the greeter should mirror from the desktop (colour scheme light/dark,
# accent colour, GTK/icon theme, fonts, cursor) is NOT configured here: it is
# generated into /etc/dconf/db/gdm.d/50-dotfiles-desktop-sync from the LIVE
# org.gnome.desktop.interface values, refreshed by re-running:
#   sudo just gdm-theme
#
# dconf compiles every keyfile in /etc/dconf/db/gdm.d/ into one database, so the
# two files must not define the same key.
#
# (The greeter is not a normal session: extensions without session-modes
# ["gdm"] never load here, which is why the desktop's Blur my Shell cannot be
# used on the login screen.)
