---
# Developer tools & AI agents (pi-coding-agent, opencode, hermes)

- name: Ensure user npm global bin directory exists
  ansible.builtin.file:
    path: "{{ ansible_facts['user_dir'] | default(lookup('env', 'HOME')) }}/.npm-global"
    state: directory
    mode: "0755"

- name: Configure npm prefix to ~/.npm-global
  ansible.builtin.command:
    cmd: npm config set prefix "{{ ansible_facts['user_dir'] | default(lookup('env', 'HOME')) }}/.npm-global"
  register: npm_prefix_result
  changed_when: false

- name: Install or update pi-coding-agent globally
  ansible.builtin.command:
    cmd: npm install -g --ignore-scripts @earendil-works/pi-coding-agent
  register: npm_pi_result
  changed_when: "'added' in npm_pi_result.stdout or 'updated' in npm_pi_result.stdout"
  failed_when: npm_pi_result.rc != 0

- name: Install OpenCode CLI V2
  when: opencode_v2.enabled | bool
  tags: [opencode]
  block:
    - name: Check whether OpenCode is already installed
      ansible.builtin.stat:
        path: "{{ ansible_facts['user_dir'] | default(lookup('env', 'HOME')) }}/.opencode/bin/opencode"
      register: opencode_stat

    - name: Ensure the local source cache directory exists
      ansible.builtin.file:
        path: "{{ ansible_facts['user_dir'] | default(lookup('env', 'HOME')) }}/.cache/dotfiles-src"
        state: directory
        mode: "0755"
      when: not opencode_stat.stat.exists

    - name: Download the OpenCode installer
      ansible.builtin.get_url:
        url: https://opencode.ai/v2/install
        dest: "{{ ansible_facts['user_dir'] | default(lookup('env', 'HOME')) }}/.cache/dotfiles-src/opencode-install.sh"
        mode: "0755"
      when: not opencode_stat.stat.exists

    - name: Install OpenCode V2 with the official installer
      ansible.builtin.command:
        cmd: >-
          {{ ansible_facts['user_dir'] | default(lookup('env', 'HOME')) }}/.cache/dotfiles-src/opencode-install.sh
          --no-modify-path
        creates: "{{ ansible_facts['user_dir'] | default(lookup('env', 'HOME')) }}/.opencode/bin/opencode"
      when: not opencode_stat.stat.exists
      register: opencode_install_result

- name: Install Hermes Agent
  when: hermes_agent.enabled | bool
  tags: [hermes]
  block:
    - name: Check whether Hermes Agent is already installed
      ansible.builtin.stat:
        path: "{{ ansible_facts['user_dir'] | default(lookup('env', 'HOME')) }}/.local/bin/hermes"
      register: hermes_stat

    - name: Ensure user local bin directory exists
      ansible.builtin.file:
        path: "{{ ansible_facts['user_dir'] | default(lookup('env', 'HOME')) }}/.local/bin"
        state: directory
        mode: "0755"
      when: not hermes_stat.stat.exists

    - name: Ensure the local source cache directory exists
      ansible.builtin.file:
        path: "{{ ansible_facts['user_dir'] | default(lookup('env', 'HOME')) }}/.cache/dotfiles-src"
        state: directory
        mode: "0755"
      when: not hermes_stat.stat.exists

    - name: Download the Hermes Agent installer
      ansible.builtin.get_url:
        url: https://hermes-agent.nousresearch.com/install.sh
        dest: "{{ ansible_facts['user_dir'] | default(lookup('env', 'HOME')) }}/.cache/dotfiles-src/hermes-install.sh"
        mode: "0755"
      when: not hermes_stat.stat.exists

    - name: Install Hermes Agent (non-interactive)
      ansible.builtin.command:
        cmd: >-
          {{ ansible_facts['user_dir'] | default(lookup('env', 'HOME')) }}/.cache/dotfiles-src/hermes-install.sh
          --non-interactive
          --channel {{ hermes_agent.channel }}
          {{ '--skip-browser' if hermes_agent.skip_browser | bool else '' }}
          {{ '--skip-computer-use' if hermes_agent.skip_computer_use | bool else '' }}
        creates: "{{ ansible_facts['user_dir'] | default(lookup('env', 'HOME')) }}/.local/bin/hermes"
      register: hermes_install_result
