---
- name: Enable and start user-level systemd services
  ansible.builtin.systemd:
    name: "{{ item }}"
    scope: user
    enabled: true
    state: started
  loop: "{{ (user_services | default([], true)) + (user_services_extra | default([], true)) }}"

# GNOME Software starts with the session and can monopolize CPU/IO while it
# loads appstream metadata and icons. Keep it functional, but let GNOME Shell
# win contention during the first few seconds after login.
- name: Ensure GNOME Software systemd drop-in directory exists
  ansible.builtin.file:
    path: "{{ ansible_facts['user_dir'] | default(lookup('env', 'HOME')) }}/.config/systemd/user/gnome-software.service.d"
    state: directory
    mode: "0755"

- name: Lower GNOME Software background service priority
  ansible.builtin.copy:
    dest: "{{ ansible_facts['user_dir'] | default(lookup('env', 'HOME')) }}/.config/systemd/user/gnome-software.service.d/50-priority.conf"
    mode: "0644"
    content: |
      [Service]
      Nice=10
      IOSchedulingClass=idle
      CPUWeight=50
      IOWeight=50
  register: gnome_software_priority

- name: Reload user systemd manager after GNOME Software priority change
  ansible.builtin.command:
    cmd: systemctl --user daemon-reload
  when: gnome_software_priority.changed
  changed_when: false
