---
# ==============================================================================
# Declarative Fedora Workstation Playbook
# ==============================================================================

# ------------------------------------------------------------------------------
# Play 1: System-level configuration (Root / become: true)
# ------------------------------------------------------------------------------
- name: System Configuration (Fedora RPMs, COPR, Flathub, Systemd)
  hosts: localhost
  connection: local
  become: true
  tags: [system]

  vars_files:
    - vars/default.yml

  pre_tasks:
    - name: Check if local overrides exist
      ansible.builtin.stat:
        path: "{{ playbook_dir }}/vars/local.yml"
      register: system_local_vars_stat

    - name: Load local overrides if present
      ansible.builtin.include_vars:
        file: "{{ playbook_dir }}/vars/local.yml"
      when: system_local_vars_stat.stat.exists

  tasks:
    - name: Configure third-party RPM repositories
      ansible.builtin.import_tasks: tasks/system/repos.yml
      tags: [repos]

    - name: Configure COPR repositories
      ansible.builtin.import_tasks: tasks/system/copr.yml
      tags: [copr]

    - name: Install system RPM packages
      ansible.builtin.import_tasks: tasks/system/packages.yml
      tags: [packages]

    - name: Configure system alternatives (vi/vim to nvim)
      ansible.builtin.import_tasks: tasks/system/alternatives.yml
      tags: [alternatives]

    - name: Setup Flatpak repository
      ansible.builtin.import_tasks: tasks/system/flatpak_repo.yml
      tags: [flatpak_repo]

    - name: Configure system services
      ansible.builtin.import_tasks: tasks/system/services.yml
      tags: [services]

# ------------------------------------------------------------------------------
# Play 2: User-level configuration (Non-root / become: false)
# ------------------------------------------------------------------------------
- name: User Configuration (Dotfiles, User Flatpaks, User Systemd, Dev Tools)
  hosts: localhost
  connection: local
  become: false
  tags: [user]

  vars_files:
    - vars/default.yml

  pre_tasks:
    - name: Check if local overrides exist
      ansible.builtin.stat:
        path: "{{ playbook_dir }}/vars/local.yml"
      register: user_local_vars_stat

    - name: Load local overrides if present
      ansible.builtin.include_vars:
        file: "{{ playbook_dir }}/vars/local.yml"
      when: user_local_vars_stat.stat.exists

  tasks:
    - name: Deploy dotfiles symlinks via GNU Stow
      ansible.builtin.import_tasks: tasks/user/dotfiles.yml
      tags: [dotfiles]

    - name: Install user Flatpak applications
      ansible.builtin.import_tasks: tasks/user/flatpak_apps.yml
      tags: [flatpak]

    - name: Configure developer CLI tools and agents
      ansible.builtin.import_tasks: tasks/user/dev_tools.yml
      tags: [dev_tools]

    - name: Setup Google Antigravity CLI
      ansible.builtin.import_tasks: tasks/user/antigravity.yml
      tags: [antigravity]

    - name: Install GNOME Shell extensions via gext
      ansible.builtin.import_tasks: tasks/user/gnome_extensions.yml
      tags: [gnome, gnome_ext, extensions]

    - name: Configure GNOME themes, icons, cursor and fonts
      ansible.builtin.import_tasks: tasks/user/gnome_themes.yml
      tags: [gnome, gnome_themes, theme, fonts]

    - name: Configure GNOME desktop settings via dconf
      ansible.builtin.import_tasks: tasks/user/gnome_settings.yml
      tags: [gnome, gnome_settings, dconf]

    - name: Configure user services
      ansible.builtin.import_tasks: tasks/user/services.yml
      tags: [user_services]
