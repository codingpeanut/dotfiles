---
# Default declarative configuration for Fedora GNOME

# COPR repositories to enable
system_copr_repos:
  - atim/starship

# System RPM packages to install via DNF
system_packages:
  # GNOME Desktop & Shell Tweaking
  - gnome-tweaks
  - gnome-extensions-app
  - dconf
  - pipx
  - python3-gobject
  - sassc
  - gtk-murrine-engine

  # GNOME Theme Assets (GTK engine, icons, cursor, UI fonts)
  - papirus-icon-theme
  - bibata-cursor-theme
  - rsms-inter-fonts

  # Chinese Input Method (Fcitx5 Framework & Engines)
  - fcitx5
  - fcitx5-chinese-addons
  - fcitx5-chewing
  - fcitx5-configtool
  - fcitx5-gtk3
  - fcitx5-gtk4
  - fcitx5-qt5
  - fcitx5-qt6

  # CJK, Emoji & Base Fonts
  - google-noto-sans-cjk-fonts
  - google-noto-serif-cjk-fonts
  - google-noto-color-emoji-fonts
  - jetbrains-mono-fonts

  # Desktop Utilities & File Management
  - nautilus
  - file-roller
  - blueman
  - bluez
  - bluez-tools
  - nm-connection-editor
  - network-manager-applet
  - NetworkManager-tui
  - gnome-calendar
  - gnome-control-center

  # Multimedia Codecs (RPM Fusion GStreamer plugins)
  - gstreamer1-plugins-ugly
  - gstreamer1-plugins-bad-freeworld
  - gstreamer1-plugin-openh264

  # Applications & Browsers
  - google-chrome-stable
  - code

  # Editors & Text Tools
  - neovim
  - vim-enhanced

  # Shell, Prompt & Terminal Aesthetics
  - btop
  - starship
  - zoxide
  - fzf
  - eza
  - bat
  - fastfetch

  # Developer Runtimes & Package Managers
  - nodejs
  - npm
  - python3
  - python3-pip
  - gcc
  - cmake
  - ninja-build

  # Core Tools & Workflow
  - stow
  - just
  - git
  - curl
  - jq
  - ripgrep
  - fd-find

  # Wayland Utilities & Audio / Brightness / Clipboard
  - wl-clipboard
  - cliphist
  - brightnessctl
  - ddcutil
  - playerctl
  - pavucontrol
  - libnotify
  - cava

# System services to enable and start (systemd system-level)
system_services:
  - bluetooth

# User services to enable and start (systemd user-level)
user_services: []

# Flatpak applications to install for current user
flatpak_user_packages:
  - com.discordapp.Discord
  # GUI fallback / companion for gext-based extension management
  - com.mattjakeman.ExtensionManager

# GNU Stow modules to symlink into $HOME
stow_packages:
  - gnome
  - bash
  - kitty
  - nvim
  - starship
  - fcitx5
