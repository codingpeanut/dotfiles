# =============================================================================
# Kitty 終端機設定 (Catppuccin Mocha + 絲滑 GPU 加速與毛玻璃透明度)
# =============================================================================

# 字型設定
font_family      JetBrainsMono Nerd Font
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size        11.0

# 視窗邊界與內距
window_padding_width 12 14

# 毛玻璃微透背景 (配合 Niri 合成器)
background_opacity 0.88
background_blur 20

# 絲滑捲動與更新頻率
repaint_delay 10
input_delay 3
sync_to_monitor yes

# 游標動態 (柔和脈衝)
cursor_shape beam
cursor_beam_thickness 1.8
cursor_blink_interval 0.5

# 滾動行數緩衝
scrollback_lines 10000

# 關閉提示音
enable_audio_bell no

# =============================================================================
# 配色方案：Catppuccin Mocha (經典深灰紫)
# =============================================================================
background            #1e1e2e
foreground            #cdd6f4
selection_background  #f5e0dc
selection_foreground  #1e1e2e

# 游標顏色
cursor                #f5e0dc
cursor_text_color     #1e1e2e

# URL 下劃線顏色
url_color             #f5e0dc

# 邊框色彩
active_border_color   #b4befe
inactive_border_color #45475a
bell_border_color     #f9e2af

# 分頁列樣式
tab_bar_style         powerline
tab_powerline_style   slanted
active_tab_foreground   #11111b
active_tab_background   #cba6f7
inactive_tab_foreground #cdd6f4
inactive_tab_background #181825

# 16 色 ANSI 調色盤
# 黑色
color0 #45475a
color8 #585b70

# 紅色
color1 #f38ba8
color9 #f38ba8

# 綠色
color2  #a6e3a1
color10 #a6e3a1

# 黃色
color3  #f9e2af
color11 #f9e2af

# 藍色
color4  #89b4fa
color12 #89b4fa

# 洋紅 (Magenta)
color5  #f5c2e7
color13 #f5c2e7

# 青色 (Cyan)
color6  #94e2d5
color14 #94e2d5

# 白色
color7  #bac2de
color15 #a6adc8
